dataset: meta-mini-imagenet
test:
  split: meta-test
  image_size: 84
  normalization: False
  transform: null
  n_batch: 150
  n_episode: 4
  n_way: 5
  n_shot: 5
  n_query: 5

load: ./save/convnet4_mini-imagenet_5_way_5_shot/max-va.pth

inner_args:
  n_step: 10
  encoder_lr: 0.01
  classifier_lr: 0.01
  first_order: False
  frozen:
    - bn

transport_mode: "none"      # none | scalar_gate | low_rank
low_rank_rank: 4
low_rank_init_scale: 1e-3
use_shift_aware_residual_gate: false
residual_gate_eps: 0.05
residual_gate_hidden_dim: 64
shift_gate_detach_context: true
epoch: 10
