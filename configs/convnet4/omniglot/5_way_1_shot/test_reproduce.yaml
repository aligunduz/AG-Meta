dataset: meta-omniglot
data_root: "C:/Users/aligunduz/PycharmProjects/PyTorch-MAML/data/omniglot/"
test:
  split: meta-test
  image_size: 84
  normalization: False
  transform: null
  n_batch: 150
  n_episode: 4
  n_way: 5
  n_shot: 1
  n_query: 1

load: ./save/convnet4_omniglot_5_way_1_shot/max-va.pth

inner_args:
  n_step: 10
  encoder_lr: 0.01
  classifier_lr: 0.01
  first_order: False  # set to True for FOMAML
  frozen:
    - bn

transport_mode: "none"      # none | scalar_gate | low_rank
low_rank_rank: 4
low_rank_init_scale: 1e-3
epoch: 10